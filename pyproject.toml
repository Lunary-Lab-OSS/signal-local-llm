[project]
name = "signal-local-llm"
version = "0.2.0"
description = "Local LLM inference for Signal Switchboard"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub[hf-xet]>=0.20.0",
    # Security floor for torch/textstat and other runtime consumers.
    "setuptools>=83.0.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.4.0"]
exllamav2 = [
    "exllamav2",
]
# vLLM is unavailable until upstream permits setuptools>=83.
transformers = [
    "torch>=2.4.0",
    "safetensors>=0.4.0",
    "transformers>=4.45.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
]
mlx = [
    "mlx-lm>=0.16.0",
]
cuda = [
    "torch>=2.4.0",
    "safetensors>=0.4.0",
    "transformers>=4.45.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "exllamav2",
]
routellm = [
    "routellm",
    "sentence-transformers>=2.2.0",
    # Last selected cmudict-based release; NLTK currently has no advisory fix.
    "textstat==0.7.8",
    "torch>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=5.0.0",
    "ruff==0.15.14",
    "mypy==2.3.1",
    "numpy>=1.24.0",
    # The unit suite exercises the torch-gated router modules on CPU.
    "torch>=2.4.0",
    "textstat==0.7.8",
    "torchao>=0.7.0",
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
    [{ extra = "cpu" }, { extra = "exllamav2" }],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signal_llm", "signal_local_llm"]

[tool.hatch.build.targets.sdist]
include = [
    "signal_llm",
    "signal_local_llm",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    ".github/workflows/ci.yml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit rule selection keeps behavior deterministic across ruff versions
# (0.16+ expanded default rules). Pinned in CI.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PERF", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These modules carry long scientific-citation docstrings and log lines where
# wrapping harms readability; line length is not enforced for them.
"signal_llm/router/model.py" = ["E501"]
"signal_llm/component.py" = ["E501"]
"signal_llm/intent_router.py" = ["E501"]
"signal_llm/router/sota.py" = ["E501"]
"signal_llm/router/matrix_factorization.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
# Optional heavy backends are not importable in the unit-test environment.
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: downloads real models; enable with SIGNAL_LLM_INTEGRATION=1",
]

[tool.coverage.run]
source = ["signal_llm"]
branch = true
# No module-wide omits: torch-gated modules run under the real CPU torch in
# the locked dev environment; heavy backends are exercised through seams.

[tool.coverage.report]
show_missing = true
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
