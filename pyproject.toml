[project]
name = "signal-local-llm"
version = "0.1.0"
description = "Local LLM inference for Signal Switchboard"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub[hf-xet]>=0.20.0",
]

[project.optional-dependencies]
exllamav2 = [
    "exllamav2",
]
vllm = [
    "vllm>=0.4.0",
]
transformers = [
    "torch>=2.4.0",
    "safetensors>=0.4.0",
    "transformers>=4.45.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
]
mlx = [
    "mlx-lm>=0.16.0",
]
cuda = [
    "torch>=2.4.0",
    "safetensors>=0.4.0",
    "transformers>=4.45.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "exllamav2",
    "vllm>=0.4.0",
]
routellm = [
    "routellm",
    "sentence-transformers>=2.2.0",
    "textstat>=0.7.0",
]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.100.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signal_llm", "signal_local_llm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit rule selection keeps behavior deterministic across ruff versions
# (0.16+ expanded default rules). Pinned to 0.15.x in CI and mise.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PERF", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These modules carry long scientific-citation docstrings and log lines where
# wrapping harms readability; line length is not enforced for them.
"signal_llm/router/model.py" = ["E501"]
"signal_llm/component.py" = ["E501"]
"signal_llm/intent_router.py" = ["E501"]
"signal_llm/router/sota.py" = ["E501"]
"signal_llm/router/matrix_factorization.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["signal_llm"]
branch = true
# Torch-gated neural modules (sota router student head, linguistic feature
# extractor needing torch+textstat, coreml wrapper needing coremltools) run in
# the integration track where those runtimes are present.
omit = [
    "signal_llm/router/model.py",
    "signal_llm/router/sota.py",
    "signal_llm/router/features.py",
    "signal_llm/router/coreml_complexity.py",
]

[tool.coverage.report]
show_missing = true
